<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">

<title>Ôn tập CX2 – Giao tiếp công xưởng (Bài 1–3)</title>
<style>
:root{--bg:#f4efe4;--sf:#fffdf8;--sf2:#f8f2e4;--ink:#1c2331;--mu:#636a7a;--ln:#ded6c2;--ac:#d9480f;--acs:#fde8d9;--aci:#fff;--nv:#243b5e;--nvs:#e6ebf4;--ok:#2b8a3e;--oks:#e1f3e4;--bd:#c92a2a;--bds:#fbe4e4;

@media (prefers-color-scheme:dark){:root{--bg:#12151c;--sf:#1b2029;--sf2:#222835;--ink:#eceff5;--mu:#9aa2b5;--ln:#2e3545;--ac:#ff8a3d;--acs:#3a2616;--aci:#1b1209;--nv:#9bb8ea;--nvs:#1f2a3f;--ok:#5bd37a;--oks:#173222;--bd:#ff7b7b;--bds:#3a1c1c;--sh:0 10px 28px rgba(0,0,0,.4)}}
*{box-sizing:border-box}html{font-size:16px}html.big{font-size:20px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5}
button{font:inherit;color:inherit;cursor:pointer}
.top{background:#243b5e;color:#fff;position:relative;padding:14px 14px 20px}
.top::after{content:"";position:absolute;left:0;right:0;bottom:0;height:6px;background:repeating-linear-gradient(135deg,#ffa94d 0 12px,#1c2331 12px 24px)}
.top-in{max-width:920px;margin:0 auto;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
.top h1{margin:0;font-size:1.2rem;line-height:1.2}.top small{opacity:.8;display:block;font-weight:400;font-size:.8rem}
.nav{display:flex;gap:6px;flex-wrap:wrap}
.nav button{border:1px solid rgba(255,255,255,.35);background:transparent;color:#fff;border-radius:8px;padding:6px 12px;font-weight:600;font-size:.88rem}
.wrap{max-width:920px;margin:0 auto;padding:16px 12px 40px}
h2{margin:6px 0 4px;font-size:1.35rem}h3{margin:0 0 4px}
.mu{color:var(--mu);font-size:.92rem}
.btn{border:2px solid var(--ln);background:var(--sf);border-radius:12px;padding:12px 16px;min-height:3.1rem;font-weight:700;font-size:1rem}
.btn:hover:not(:disabled){filter:brightness(.97)}.btn:disabled{opacity:.45;cursor:default}
.btn.cta{background:var(--ac);border-color:var(--ac);color:var(--aci)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.sm{min-height:0;padding:5px 12px;font-size:.85rem;border-width:1px}
.btn.ghost{background:transparent}
button:focus-visible,textarea:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));margin-top:12px}
.lcard,.setup,.qcard,.panel{background:var(--sf);border:1px solid var(--ln);border-radius:16px;box-shadow:var(--sh);padding:16px;position:relative;overflow:hidden}
.lcard::before,.qcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--ac)}
.lcard .btns{display:grid;gap:8px;margin-top:12px}
.lstat{font-size:.88rem;color:var(--mu);margin-top:6px;min-height:2.6em}
.tip{background:var(--nvs);border-radius:12px;padding:10px 14px;font-size:.92rem;margin-top:10px}
.chips,.pills{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.chip,.pill{border:2px solid var(--ln);background:var(--sf);border-radius:999px;padding:9px 16px;font-weight:700}
.chip[aria-pressed=true],.pill[aria-pressed=true]{border-color:var(--ac);background:var(--acs);color:var(--ac)}
.zp{display:inline-flex;flex-direction:column;align-items:center;line-height:1.2;text-align:center}
.zp.left{align-items:flex-start;text-align:left}
.zp .zh{font-family:var(--zh);font-size:1.5rem;font-weight:500}
.zp .py{color:var(--ac);font-style:italic;font-size:.95rem}
.zp.sm .zh{font-size:1.3rem}.zp.sm .py{font-size:.82rem}
.zp.lg .zh{font-size:clamp(2rem,6vw,2.9rem)}.zp.lg .py{font-size:1.1rem}
.zp.xl .zh{font-size:clamp(3.2rem,11vw,5rem)}.zp.xl .py{font-size:1.3rem}
.rh{display:flex;align-items:center;gap:10px;font-size:.9rem;color:var(--mu);margin-bottom:10px;flex-wrap:wrap}
.rh .prog{flex:1;min-width:80px}.rh b{color:var(--ink)}
.prog{height:7px;background:var(--ln);border-radius:7px;overflow:hidden}.prog i{display:block;height:100%;background:var(--ac)}
.kind{font-size:.78rem;font-weight:800;color:var(--ac);text-transform:uppercase;letter-spacing:.5px}
.qlabel{font-weight:700;margin:4px 0 8px}
.qz{display:flex;justify-content:center;align-items:center;gap:10px;margin:6px 0}
.qvi{text-align:center;font-size:clamp(1.3rem,4.5vw,1.8rem);font-weight:700;margin:6px 0}
.qhint{text-align:center;color:var(--mu)}
.opts{display:grid;gap:10px;margin-top:14px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;border:2px solid var(--ln);background:var(--sf);border-radius:14px;padding:12px 14px;min-height:3.4rem;width:100%}
.opt:hover:not(:disabled){border-color:var(--ac)}.opt:disabled{cursor:default}
.opt .k{flex:none;width:30px;height:30px;border-radius:50%;background:var(--sf2);display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:.85rem;color:var(--mu)}
.opt .t{font-weight:600;font-size:1.1rem}.opt .vv{display:block;color:var(--mu);font-size:.88rem}
.opt.ok{border-color:var(--ok);background:var(--oks)}.opt.ok .k{background:var(--ok);color:#fff}
.opt.bd{border-color:var(--bd);background:var(--bds)}.opt.bd .k{background:var(--bd);color:#fff}
.fb{margin-top:14px;border-radius:12px;padding:12px 14px;background:var(--nvs)}.fb.ok{background:var(--oks)}.fb.bd{background:var(--bds)}
.fb h4{margin:0 0 6px}.ln{display:flex;gap:10px;margin:8px 0;align-items:flex-start}.ln>b{color:var(--ac);min-width:1.4em}
.ln .vi{color:var(--mu);font-size:.95rem;margin-top:2px}.nt{margin-top:6px;font-size:.92rem}
.ansline,.bank{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.ansline{min-height:4.6rem;border:2px dashed var(--ln);border-radius:12px;padding:8px;align-items:center}
.ansline.ok{border-color:var(--ok);background:var(--oks)}.ansline.bd{border-color:var(--bd);background:var(--bds)}
.ph{color:var(--mu);font-size:.9rem}
.tk{border:2px solid var(--ln);background:var(--sf);border-radius:12px;padding:6px 12px;min-height:3.2rem}
.tk:hover:not(:disabled){border-color:var(--ac)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.full{width:100%;margin-top:12px}
textarea{width:100%;font:inherit;background:var(--sf);color:var(--ink);border:2px solid var(--ln);border-radius:12px;padding:10px;margin-top:10px;resize:vertical}
.mine{margin-top:10px;font-size:.92rem;background:var(--sf2);border-radius:10px;padding:8px 12px}
.spk{border:1px solid var(--ln);background:var(--sf);color:var(--ac);width:34px;height:34px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;padding:0;flex:none}
.spk svg{width:17px;height:17px}.nospeech .spk{display:none}
.ring{--p:0;width:150px;height:150px;border-radius:50%;margin:8px auto;display:grid;place-items:center;background:conic-gradient(var(--ok) calc(var(--p)*1%),var(--ln) 0)}
.ring div{width:118px;height:118px;border-radius:50%;background:var(--sf);display:grid;place-items:center;text-align:center;line-height:1.1}.ring b{font-size:2rem}.ring span{font-size:.8rem;color:var(--mu)}
.bars{display:grid;gap:8px;margin:10px 0}.bar{display:grid;grid-template-columns:8.5rem 1fr 3.6rem;gap:8px;align-items:center;font-size:.9rem}
.bar .prog{height:10px}.bar .prog i{background:var(--ok)}
.wi{border:1px solid var(--ln);border-left:5px solid var(--bd);border-radius:10px;padding:10px 12px;background:var(--sf);margin-top:10px}
.wi .kd{font-size:.75rem;font-weight:800;color:var(--bd);text-transform:uppercase}
.acts{display:grid;gap:8px;margin-top:16px}
.tbl{width:100%;border-collapse:collapse;font-size:.92rem;margin:8px 0}.tbl th,.tbl td{border-bottom:1px solid var(--ln);padding:8px 6px;text-align:center}.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl-w{overflow-x:auto}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.tabs button{border:2px solid var(--ln);background:var(--sf);border-radius:10px;padding:8px 14px;font-weight:700}
.tabs button[aria-pressed=true]{background:var(--nv);border-color:var(--nv);color:#fff}
@media (prefers-color-scheme:dark){.tabs button[aria-pressed=true]{color:#12151c}}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.vc{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:10px;text-align:center}.vc .vi{font-weight:600;margin-top:4px}
.sent{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:10px 12px;margin:8px 0;display:flex;gap:10px;justify-content:space-between;align-items:flex-start}
.sent .vi{color:var(--mu);margin-top:2px}
.dh{font-weight:800;color:var(--nv);margin:16px 0 4px}
.pat{font-family:var(--zh);font-weight:700;font-size:1.15rem;border:1px dashed var(--nv);border-radius:8px;padding:6px 12px;margin:8px 0;display:inline-block}.pat .py{display:block;font-family:var(--sans);font-weight:400;font-size:.85rem;color:var(--ac);font-style:italic}
.lst{display:grid;grid-template-columns:auto auto 1fr;gap:4px 12px;align-items:baseline;margin:6px 0}.lst .zh{font-family:var(--zh);font-size:1.2rem;font-weight:600}.lst .p{color:var(--ac);font-style:italic}
@media (max-width:560px){.bar{grid-template-columns:6.5rem 1fr 3rem}.two{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

const $=s=>document.querySelector(s);

const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const pct=(c,t)=>t?Math.round(c*100/t):0;
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const zp=s=>{const i=s.indexOf(":");return {zh:s.slice(0,i),py:s.slice(i+1)};};
const rows=s=>s.trim().split("\n").map(r=>r.split("|"));
const Z=(zh,py,c="")=>`<span class="zp ${c}"><span class="zh" lang="zh-CN">${esc(zh)}</span><span class="py">${esc(py)}</span></span>`;

const spk=t=>`<button class="spk" data-act="speak" data-t="${esc(t.replace(/_+/g,""))}" aria-label="Nghe phát âm">${SPK}</button>`;
function speak(t){if(!("speechSynthesis" in window))return;const u=new SpeechSynthesisUtterance(t);u.lang="zh-CN";u.rate=.8;const v=speechSynthesis.getVoices().find(v=>/^zh/i.test(v.lang));if(v)u.voice=v;speechSynthesis.cancel();speechSynthesis.speak(u);}

const LN={"1":"Bài 1 · Các câu giao tiếp thông dụng trong công xưởng","2":"Bài 2 · Từ vựng công xưởng – ghép câu cơ bản","3":"Bài 3 · Xin phép – nghỉ phép","all":"Ôn tập tổng hợp (Bài 1 + 2 + 3)"};
const LB={"1":"Bài 1","2":"Bài 2","3":"Bài 3","all":"Tổng hợp"};
const LS={"1":["1"],"2":["2"],"3":["3"],all:["1","2","3"]};
const KN={vocab:"Trắc nghiệm từ vựng",gram:"Chọn ngữ pháp đúng",fill:"Điền từ",order:"Sắp xếp câu",z2v:"Dịch Trung → Việt",v2z:"Dịch Việt → Trung",talk:"Tình huống giao tiếp"};
const KS={vocab:"Từ vựng",gram:"Ngữ pháp",fill:"Điền từ",order:"Sắp xếp câu",z2v:"Trung → Việt",v2z:"Việt → Trung",talk:"Tình huống"};
const KO=Object.keys(KN);

const WORDS=[];["1","2","3"].forEach(l=>VOCAB[l].forEach(w=>WORDS.push({...w,l})));
const LEX={};WORDS.forEach(w=>LEX[w.zh]=w.py);
Object.assign(LEX,{"要":"yào","最":"zuì","几十":"jǐshí","几":"jǐ","是不是":"shì bú shì","每":"měi","多":"duō","给":"gěi","一下":"yíxià","什么":"shénme","做":"zuò"});
const LK=Object.keys(LEX).sort((a,b)=>b.length-a.length);
const pyOf=s=>s.replace(/[\u4e00-\u9fff]+/g,run=>{const o=[];let i=0;while(i<run.length){const k=LK.find(k=>run.startsWith(k,i));if(!k){o.push("?");i++;}else{o.push(LEX[k]);i+=k.length;}}return o.join(" ");});

const EX={};["1","2","3"].forEach(l=>EX[l]={gram:rows(GRAMQ[l]),fill:rows(FILLQ[l]),order:rows(ORDQ[l]),z2v:Z2V[l],v2z:V2Z[l],reflex:REFLEX[l]});

/* ---------- tạo câu hỏi ---------- */
const mk=(k,l,prompt,opts,reveal,note)=>({k,l,t:"mc",prompt,opts,reveal,note:note||""});
const wordsOf=s=>s.toLowerCase().split(/[\s\/;,]+/).filter(Boolean);
function vocabQ(w,pool){
  const ws=new Set(wordsOf(w.vi));
  const good=x=>{if(x.zh===w.zh||x.zh.includes(w.zh)||w.zh.includes(x.zh))return false;const xs=wordsOf(x.vi),sh=xs.filter(t=>ws.has(t)).length;return !(sh>=2||(sh>=1&&Math.min(xs.length,ws.size)<=2));};
  let c=shuffle(pool.filter(good));
  if(c.length<3)c=c.concat(shuffle(pool.filter(x=>x.zh!==w.zh&&!c.includes(x))));
  const ds=c.slice(0,3),rv=[{lab:"",zh:w.zh,py:w.py,vi:w.vi}];
  if(Math.random()<.5)return mk("vocab",w.l,{label:"Từ này nghĩa là gì?",zh:w.zh,py:w.py,big:1},[{t:w.vi,ok:true},...ds.map(x=>({t:x.vi,ok:false}))],rv);
  return mk("vocab",w.l,{label:"Chọn từ tiếng Trung đúng",vi:w.vi},[{zh:w.zh,py:w.py,ok:true},...ds.map(x=>({zh:x.zh,py:x.py,ok:false}))],rv);
}
function gramQ(l,r){
  const a=zp(r[1]);
  return mk("gram",l,{label:"Chọn câu tiếng Trung đúng ngữ pháp",vi:r[0]},[{...a,ok:true},...r[2].split("/").map(s=>({...zp(s),ok:false}))],[{lab:"",...a,vi:r[0]}],r[3]);
}
function fillQ(l,r){
  const a=zp(r[3]);
  return mk("fill",l,{label:"Điền từ vào chỗ trống",zh:r[0],py:r[1],hint:r[2]},[{...a,ok:true},...r[4].split("/").map(s=>({...zp(s),ok:false}))],[{lab:"",zh:r[0].replace("___",a.zh),py:r[1].replace("___",a.py),vi:r[2]}],r[5]);
}
function orderQ(l,r){
  const tk=r[0].split("/").map(zp),p=r[1];
  return {k:"order",l,t:"order",prompt:{label:"Sắp xếp các từ thành câu đúng",vi:r[2]},tokens:tk,
    reveal:[{lab:"",zh:tk.map(t=>t.zh).join("")+p,py:cap(tk.map(t=>t.py).join(" "))+(p==="？"?"?":"."),vi:r[2]}],
    note:"Thứ tự theo câu mẫu trong bài. Nếu câu bạn xếp vẫn đúng nghĩa, hãy hỏi giáo viên."};
}
function selfQ(l,r,dir){
  const rv=[{lab:"Đáp án tham khảo",zh:r.zh,py:r.py,vi:r.vi}];
  return dir==="z2v"?{k:"z2v",l,t:"self",prompt:{label:"Dịch câu sau sang tiếng Việt",zh:r.zh,py:r.py},reveal:rv,ph:"Viết nghĩa tiếng Việt của bạn (không bắt buộc)…"}
    :{k:"v2z",l,t:"self",prompt:{label:"Dịch câu sau sang tiếng Trung",vi:r.vi},reveal:rv,ph:"Viết bằng chữ Hán hoặc pinyin (không bắt buộc)…"};
}
const GEN=/^(好|可以|明白|没问题|对|那太好了)/;
const op1=s=>s.split("，")[0];
function talkItems(l){
  const out=[],ds=DLG.filter(d=>d.l===l);
  ds.forEach(d=>{for(let i=0;i<d.lines.length;i+=2){
    const A=d.lines[i],B=d.lines[i+1];let pool=[];
    ds.forEach(e=>{if(e!==d)for(let j=1;j<e.lines.length;j+=2)pool.push(e.lines[j]);});
    let f=pool.filter(x=>!GEN.test(x.zh)&&op1(x.zh)!==op1(B.zh));if(f.length<3)f=pool.filter(x=>x.zh!==B.zh);
    const ds3=shuffle(f).slice(0,3);
    out.push(mk("talk",l,{label:"A nói — B đáp thế nào cho hợp?",zh:A.zh,py:A.py},[{zh:B.zh,py:B.py,vi:B.vi,ok:true},...ds3.map(x=>({zh:x.zh,py:x.py,vi:x.vi,ok:false}))],[{lab:"A",zh:A.zh,py:A.py,vi:A.vi},{lab:"B",zh:B.zh,py:B.py,vi:B.vi}],d.title));
  }});
  EX[l].reflex.forEach(([q,a,w])=>{
    const [qz,qp,qv]=q.split("|"),[az,ap,av]=a.split("|");
    out.push(mk("talk",l,{label:"Trả lời câu hỏi này thế nào cho đúng?",zh:qz,py:qp},[{zh:az,py:ap,vi:av,ok:true},...w.map(s=>{const [z,p,v]=s.split("|");return {zh:z,py:p,vi:v,ok:false};})],[{lab:"A",zh:qz,py:qp,vi:qv},{lab:"B",zh:az,py:ap,vi:av}],"Phản xạ hỏi–đáp"));
  });
  return out;
}
function items(ls,k){
  if(k==="vocab"){const pool=[],seen=new Set();WORDS.forEach(w=>{if(ls.includes(w.l)&&!seen.has(w.zh)){seen.add(w.zh);pool.push(w);}});return pool.map(w=>vocabQ(w,pool));}
  const out=[];
  ls.forEach(l=>{const E=EX[l];
    if(k==="gram")E.gram.forEach(r=>out.push(gramQ(l,r)));
    if(k==="fill")E.fill.forEach(r=>out.push(fillQ(l,r)));
    if(k==="order")E.order.forEach(r=>out.push(orderQ(l,r)));
    if(k==="z2v")E.z2v.forEach(r=>out.push(selfQ(l,r,"z2v")));
    if(k==="v2z")E.v2z.forEach(r=>out.push(selfQ(l,r,"v2z")));
    if(k==="talk")out.push(...talkItems(l));});
  return out;
}
function buildRound(ls,ks,n){
  const lists=ks.map(k=>shuffle(items(ls,k))),out=[];let i=0;
  while(out.length<n&&lists.some(x=>x.length)){const x=lists[i%lists.length];if(x.length)out.push(x.shift());i++;}
  return out;
}
const countOf=(ls,k)=>k==="vocab"?new Set(WORDS.filter(w=>ls.includes(w.l)).map(w=>w.zh)).size:items(ls,k).length;

  const l=V.l;
  let h=`<h2>Xem lại kiến thức</h2><div class="tabs">`+["1","2","3"].map(x=>`<button data-act="rl" data-l="${x}" aria-pressed="${l===x}">${LB[x]}</button>`).join("")+`</div><p class="mu">${esc(LN[l])}</p><div class="tabs">`+[["vocab","Từ vựng"],["sent","Mẫu câu"],["dlg","Hội thoại"],["gram","Ngữ pháp"]].map(([k,t])=>`<button data-act="rs" data-s="${k}" aria-pressed="${V.s===k}">${t}</button>`).join("")+`</div>`;
  if(V.s==="vocab")h+=`<div class="vgrid">`+VOCAB[l].map(w=>`<div class="vc">${Z(w.zh,w.py,"")}${spk(w.zh)}<div class="vi">${esc(w.vi)}</div></div>`).join("")+`</div>`;
  if(V.s==="sent")SENT[l].forEach(([g,it])=>{h+=`<div class="dh">${esc(g)}</div>`+it.map(s=>`<div class="sent"><div>${Z(s.zh,s.py,"left")}<div class="vi">→ ${esc(s.vi)}</div></div>${spk(s.zh)}</div>`).join("");});
  if(V.s==="dlg")DLG.filter(d=>d.l===l).forEach(d=>{h+=`<div class="dh">${esc(d.title)}</div>`+d.lines.map(x=>`<div class="sent"><b style="color:var(--ac)">${x.spk}</b><div style="flex:1">${Z(x.zh,x.py,"left")}<div class="vi">→ ${esc(x.vi)}</div></div>${spk(x.zh)}</div>`).join("");});
  if(V.s==="gram")GRAM[l].forEach(g=>{h+=`<div class="panel" style="margin:10px 0"><h3>${esc(g.title)}</h3><div class="mu">${esc(g.meaning)}</div>`+g.blocks.map(b=>{
    if(b.k==="pat")return `<div class="pat">${esc(b.v)}<span class="py">${esc(pyOf(b.v))}</span></div>`;
    if(b.k==="note")return `<div>${esc(b.v)}</div>`;
    if(b.k==="list")return `<div class="lst">`+b.v.map(r=>`<span class="zh" lang="zh-CN">${esc(r[0])}</span><span class="p">${esc(r[1])}</span><span>${esc(r[2])}</span>`).join("")+`</div>`;
    return `<div class="sent"><div>${Z(b.zh,b.py,"left")}<div class="vi">→ ${esc(b.vi)}</div></div>${spk(b.zh)}</div>`;}).join("")+`</div>`;});
  return h+`<div class="acts"><button class="btn cta" data-act="setup" data-l="${l}">Luyện tập ${LB[l]}</button></div>`;
}
function statsHTML(){
  const L=["1","2","3","all"];
  let h=`<h2>Thống kê kết quả</h2><div class="panel"><div class="tbl-w"><table class="tbl"><tr><th>Phần</th><th>Lượt</th><th>Gần nhất</th><th>Tốt nhất</th><th>Tích lũy</th></tr>`+L.map(l=>{const s=ST[l];return `<tr><td>${LB[l]}</td>`+(s?`<td>${s.n}</td><td>${pct(s.last[0],s.last[1])}%</td><td>${s.best}%</td><td>${pct(s.c,s.t)}%</td>`:`<td colspan="4" class="mu">chưa làm</td>`)+`</tr>`;}).join("")+`</table></div></div>`;
  h+=`<h3 style="margin-top:16px">Tỉ lệ đúng theo dạng bài (tích lũy)</h3><div class="panel"><div class="tbl-w"><table class="tbl"><tr><th>Dạng bài</th>`+L.map(l=>`<th>${LB[l]}</th>`).join("")+`</tr>`+KO.map(k=>`<tr><td>${KS[k]}</td>`+L.map(l=>{const a=ST[l]&&ST[l].k[k];return `<td>${a?pct(a[0],a[1])+"%":"–"}</td>`;}).join("")+`</tr>`).join("")+`</table></div></div>`;
  return h+`<div class="acts"><button class="btn" data-act="home">Về trang chủ</button><button class="btn ghost" data-act="clearstats">Xoá thống kê</button></div>`;
}
function render(){
  const a=$("#app");
  a.innerHTML=S.view==="home"?homeHTML():S.view==="setup"?setupHTML():S.view==="review"?reviewHTML():S.view==="stats"?statsHTML():S.view==="run"?runHTML():resultHTML();
  window.scrollTo(0,0);
}

/* ---------- luồng làm bài ---------- */
function initQ(){
  const q=R.qs[R.i];R.phase="ask";R.sel=null;R.ok=false;R.u={text:""};
  if(q.t==="mc")q.opts=shuffle(q.opts);
  if(q.t==="order"){let b;const o=q.tokens.map(t=>t.zh).join();do{b=shuffle(q.tokens);}while(b.length>1&&b.map(t=>t.zh).join()===o);R.u.bank=b;R.u.ans=[];}
}
function startRound(qs,mode){R={l:S.l,qs,i:0,score:0,wrong:[],by:{},mode,phase:"ask",u:{}};initQ();S.view="run";render();}
function start(){const n=S.n==="all"?Infinity:S.n;const qs=buildRound(LS[S.l],S.kinds,n);if(qs.length)startRound(qs,"full");}
function record(ok){
  const q=R.qs[R.i];R.ok=ok;if(ok)R.score++;else R.wrong.push(q);
  const a=R.by[q.k]||(R.by[q.k]=[0,0]);if(ok)a[0]++;a[1]++;R.phase="graded";
}
function finish(){
  if(R.mode==="full"){
    const s=ST[R.l]||(ST[R.l]={n:0,c:0,t:0,best:0,last:null,k:{}}),t=R.qs.length;
    s.n++;s.c+=R.score;s.t+=t;s.last=[R.score,t];s.best=Math.max(s.best,pct(R.score,t));
    Object.entries(R.by).forEach(([k,v])=>{const a=s.k[k]||(s.k[k]=[0,0]);a[0]+=v[0];a[1]+=v[1];});persist();
  }
  S.view="result";render();
}
const nextQ=()=>{if(R.phase!=="graded")return;if(R.i+1>=R.qs.length)finish();else{R.i++;initQ();render();}};

document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]");if(!el)return;
  const act=el.dataset.act,d=el.dataset,q=R&&R.qs&&R.qs[R.i];
  switch(act){
    case "home":S.view="home";render();break;
    case "stats":S.view="stats";render();break;
    case "big":{const b=document.documentElement.classList.toggle("big");el.textContent=b?"Chữ thường":"Chữ lớn (chiếu lớp)";break;}
    case "speak":speak(d.t);break;
    case "setup":S.l=d.l;S.view="setup";render();break;
    case "kind":{const k=d.k,i=S.kinds.indexOf(k);if(i>=0){if(S.kinds.length>1)S.kinds.splice(i,1);}else S.kinds.push(k);render();break;}
    case "n":S.n=d.v==="all"?"all":parseInt(d.v,10);render();break;
    case "start":start();break;
    case "again":start();break;
    case "review":V.l=d.l;S.view="review";render();break;
    case "rl":V.l=d.l;render();break;
    case "rs":V.s=d.s;render();break;
    case "exit":if(confirm("Thoát lượt này? Kết quả lượt này sẽ không được lưu.")){S.view="home";render();}break;
    case "pick":if(R.phase==="ask"){R.sel=+d.i;record(q.opts[R.sel].ok);render();}break;
    case "place":if(R.phase==="ask"){R.u.ans.push(R.u.bank.splice(+d.i,1)[0]);render();}break;
    case "unplace":if(R.phase==="ask"){R.u.bank.push(R.u.ans.splice(+d.i,1)[0]);render();}break;
    case "clear":R.u.bank=R.u.bank.concat(R.u.ans);R.u.ans=[];render();break;
    case "check":if(R.phase==="ask"&&!R.u.bank.length){record(R.u.ans.map(t=>t.zh).join()===q.tokens.map(t=>t.zh).join());render();}break;
    case "reveal":{const tx=$("#tx");R.u.text=tx?tx.value.trim():"";R.phase="revealed";render();break;}
    case "grade":record(d.v==="y");render();break;
    case "next":nextQ();break;
    case "retry":{const qs=R.wrong.slice();startRound(qs,"retry");break;}
    case "clearstats":if(confirm("Xoá toàn bộ thống kê đã lưu trên trình duyệt này?")){ST={};persist();render();}break;
  }
});
document.addEventListener("keydown",e=>{
  if(S.view!=="run"||e.ctrlKey||e.metaKey||e.altKey||(e.target.closest&&e.target.closest("textarea")))return;
  const q=R.qs[R.i];
  if(R.phase==="ask"&&q.t==="mc"){const i="1234".indexOf(e.key);if(i>=0&&q.opts[i]){R.sel=i;record(q.opts[i].ok);render();}}
  else if(R.phase==="graded"&&(e.key==="Enter"||e.key==="ArrowRight")){e.preventDefault();nextQ();}
});
if(!("speechSynthesis" in window))document.body.classList.add("nospeech");
render();

</script>
</body>
</html>
